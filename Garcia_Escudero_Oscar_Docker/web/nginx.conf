# Bloque 1: Configuración de eventos y rendimientos
events{
    # Número máximo de conexiones simultáneas por proceso trabajador
    worker_connections 1024; # usarlo es una directiva de buenas prácticas
}

# 2. BLOQUE HTTP: Configuración para el tráfico web
http {
    # Incluye la lista predefinida de tipos de archivos (CSS, HTML, JS, imágenes, etc.)
    include       /etc/nginx/mime.types; # Obligado en la práctica

    # Tipo de archivo por defecto si Nginx no logra identificar la extensión
    default_type  application/octet-stream; # archivo de reserva para peticiones distintas del anterior

     # 3. BLOQUE SERVER: Configuración del servidor virtual / sitio web
    server {
        # Puerto en el que va a escuchar las peticiones HTTP del navegador
        listen 80;
        
        # Nombre o dominio del servidor (en desarrollo localhost)
        server_name localhost; # cambiar el nombre en producción si es necesario

        # REQUISITO: Cabecera HTTP personalizada con mi nombre completo
        # 'always' garantiza que se envíe incluso si ocurre un error (ej. 404)
        add_header X-Alumno "Oscar Garcia Escudero" always;

        # 4. BLOQUE LOCATION: Manejo de las rutas que piden los usuarios (ruta raíz '/')
        location / {
            # Ruta absoluta DENTRO del contenedor donde están los archivos estáticos HTML
            root   /usr/share/nginx/html;
            
            # Archivo por defecto que busca Nginx al entrar a la web
            index  index.html;
            
            # Intenta buscar el archivo especificado, si no existe redirige a index.html
            try_files $uri $uri/ /index.html; # evita errores 404 por defecto cargando index.html 
        }
    }
}


